<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372">
  <style>
    .sans { font-family: 'IBM Plex Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif; }
    .mono { font-family: 'Sarasa Term K Nerd Font','D2Coding','DejaVu Sans Mono',monospace; }
    .card { fill: #fcfcfb; stroke: #c3c2b7; }
    .title { font-size: 15px; font-weight: 700; fill: #0b0b0b; }
    .cmd { font-size: 14px; font-weight: 700; fill: #0b0b0b; }
    .lname { font-size: 11.5px; fill: #52514e; }
    .wname { font-size: 12px; font-weight: 700; fill: #0b0b0b; }
    .wrows { font-size: 11.5px; fill: #52514e; }
    .note { font-size: 11.5px; fill: #52514e; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="759" height="371" rx="12"/>
  <text class="sans title" x="16" y="30">같은 터미널을 네 가지로 나눈다</text>
  <text class="mono cmd" x="101" y="60" text-anchor="middle">vars</text>
  <text class="sans lname" x="101" y="76" text-anchor="middle">레이아웃 vars-even</text>
  <rect x="16" y="88" width="170" height="78" fill="#f1f0ec" stroke="#c3c2b7" stroke-width="1.3"/>
  <text class="mono wname" x="101" y="126" text-anchor="middle">src</text>
  <text class="sans wrows" x="101" y="142" text-anchor="middle">13행</text>
  <rect x="16" y="166" width="170" height="84" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.3"/>
  <text class="mono wname" x="101" y="207" text-anchor="middle">vars</text>
  <text class="sans wrows" x="101" y="223" text-anchor="middle">14행</text>
  <rect x="16" y="250" width="170" height="78" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.3"/>
  <text class="mono wname" x="101" y="288" text-anchor="middle">cmd</text>
  <text class="sans wrows" x="101" y="304" text-anchor="middle">13행</text>
  <text class="mono cmd" x="287" y="60" text-anchor="middle">vars src · dbg</text>
  <text class="sans lname" x="287" y="76" text-anchor="middle">레이아웃 src-vars</text>
  <rect x="202" y="88" width="170" height="108" fill="#f1f0ec" stroke="#c3c2b7" stroke-width="1.3"/>
  <text class="mono wname" x="287" y="141" text-anchor="middle">src</text>
  <text class="sans wrows" x="287" y="157" text-anchor="middle">18행</text>
  <rect x="202" y="196" width="170" height="54" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.3"/>
  <text class="mono wname" x="287" y="222" text-anchor="middle">vars</text>
  <text class="sans wrows" x="287" y="238" text-anchor="middle">9행</text>
  <rect x="202" y="250" width="170" height="78" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.3"/>
  <text class="mono wname" x="287" y="288" text-anchor="middle">cmd</text>
  <text class="sans wrows" x="287" y="304" text-anchor="middle">13행</text>
  <text class="mono cmd" x="473" y="60" text-anchor="middle">vars full</text>
  <text class="sans lname" x="473" y="76" text-anchor="middle">레이아웃 vars-full</text>
  <rect x="388" y="88" width="170" height="216" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.3"/>
  <text class="mono wname" x="473" y="195" text-anchor="middle">vars</text>
  <text class="sans wrows" x="473" y="211" text-anchor="middle">36행</text>
  <rect x="388" y="304" width="170" height="18" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.3"/>
  <text class="mono wname" x="473" y="317" text-anchor="middle" style="font-size:11px">cmd · 3행</text>
  <rect x="388" y="322" width="170" height="6" fill="#ebeae5" stroke="#c3c2b7" stroke-width="1.3"/>
  <text class="mono cmd" x="659" y="60" text-anchor="middle">out</text>
  <text class="sans lname" x="659" y="76" text-anchor="middle">레이아웃 out</text>
  <rect x="574" y="88" width="170" height="78" fill="#fdeadf" stroke="#eb6834" stroke-width="1.3"/>
  <text class="mono wname" x="659" y="126" text-anchor="middle">out</text>
  <rect x="574" y="166" width="170" height="84" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.3"/>
  <text class="mono wname" x="659" y="207" text-anchor="middle">vars</text>
  <rect x="574" y="250" width="170" height="78" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.3"/>
  <text class="mono wname" x="659" y="288" text-anchor="middle">cmd</text>
  <text class="sans note" x="16" y="350">40행 터미널에서 gdb 17.1의 info win으로 잰 높이(테두리 포함)다. cmd 창은 늘 터미널의 3분의 1을 가져가고, full만 3행으로 줄인다.</text>
  <text class="sans note" x="16" y="366">새로 연 out은 vars와 같은 3등분이다. 위쪽 창만 소스 대신 프로그램 출력으로 바뀐다.</text>
</svg>
