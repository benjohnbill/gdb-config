<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380">
  <style>
    .sans { font-family: 'IBM Plex Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif; }
    .mono { font-family: 'Sarasa Term K Nerd Font','D2Coding','DejaVu Sans Mono',monospace; }
    .card { fill: #fcfcfb; stroke: #c3c2b7; }
    .title { font-size: 15px; font-weight: 700; fill: #0b0b0b; }
    .sub { font-size: 12px; fill: #52514e; }
    .name { font-size: 12.5px; fill: #0b0b0b; }
    .val { font-size: 12px; fill: #52514e; }
    .big { font-size: 38px; font-weight: 700; fill: #0b0b0b; }
    .note { font-size: 11.5px; fill: #52514e; }
    .base { stroke: #c3c2b7; stroke-width: 1; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="759" height="379" rx="12"/>
  <text class="sans title" x="16" y="30">가장 많이 친 명령 10개</text>
  <text class="sans sub" x="16" y="49">gdb history에서 빈 줄을 뺀 3,155줄을 집계했다. 별칭은 원래 이름에 합쳤다.</text>
  <rect x="496" y="20" width="10" height="10" rx="2" fill="#2a78d6"/><text class="sans sub" x="512" y="30">내가 만든 명령</text>
  <rect x="616" y="20" width="10" height="10" rx="2" fill="#898781"/><text class="sans sub" x="632" y="30">gdb 기본 명령</text>
  <line class="base" x1="118" y1="66" x2="118" y2="326"/>
  <text class="mono name" x="108" y="85" text-anchor="end">track</text>
  <path d="M118,72 h396 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-396 z" fill="#2a78d6"/>
  <text class="mono val" x="526" y="85">459</text>
  <text class="mono name" x="108" y="111" text-anchor="end">next</text>
  <path d="M118,98 h317 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-317 z" fill="#898781"/>
  <text class="mono val" x="447" y="111">368</text>
  <text class="mono name" x="108" y="137" text-anchor="end">vars</text>
  <path d="M118,124 h250 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-250 z" fill="#2a78d6"/>
  <text class="mono val" x="380" y="137">291</text>
  <text class="mono name" x="108" y="163" text-anchor="end">run</text>
  <path d="M118,150 h220 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-220 z" fill="#898781"/>
  <text class="mono val" x="350" y="163">257</text>
  <text class="mono name" x="108" y="189" text-anchor="end">break</text>
  <path d="M118,176 h200 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-200 z" fill="#898781"/>
  <text class="mono val" x="330" y="189">234</text>
  <text class="mono name" x="108" y="215" text-anchor="end">print</text>
  <path d="M118,202 h188 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-188 z" fill="#898781"/>
  <text class="mono val" x="318" y="215">220</text>
  <text class="mono name" x="108" y="241" text-anchor="end">quit</text>
  <path d="M118,228 h186 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-186 z" fill="#898781"/>
  <text class="mono val" x="316" y="241">218</text>
  <text class="mono name" x="108" y="267" text-anchor="end">rerun</text>
  <path d="M118,254 h90 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-90 z" fill="#2a78d6"/>
  <text class="mono val" x="220" y="267">108</text>
  <text class="mono name" x="108" y="293" text-anchor="end">each</text>
  <path d="M118,280 h81 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-81 z" fill="#2a78d6"/>
  <text class="mono val" x="211" y="293">97</text>
  <text class="mono name" x="108" y="319" text-anchor="end">continue</text>
  <path d="M118,306 h74 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-74 z" fill="#898781"/>
  <text class="mono val" x="204" y="319">89</text>
  <text class="sans big" x="590" y="132">35.5%</text>
  <text class="sans sub" x="590" y="154">내가 만든 명령이 차지한 비율</text>
  <text class="sans sub" x="590" y="172">1,121줄 / 전체 3,155줄</text>
  <text class="sans note" x="16" y="352">연속으로 같은 줄은 history에 기록되지 않아서 next·continue는 실제보다 적게 집계된다.</text>
  <text class="sans note" x="16" y="368">내가 만든 명령은 track, vars, rerun, each, untrack, out, info track, walk, deep 등이다.</text>
</svg>
